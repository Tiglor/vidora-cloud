# 视频播放平台 - 一站式编排（基础设施 + 9 个微服务，一一对应）
#
# 使用步骤（依赖离线缓存于 F:\repository）：
#   1) 在本机用 Maven 打包所有可运行服务（产出各模块 target/*.jar）
#      & 'D:\apache-maven-3.9.6\bin\mvn.cmd' -f pom.xml -pl gateway,auth,modules/system,modules/video,modules/content,modules/interact,modules/message,modules/search,modules/recommend -am package -DskipTests -o
#   2) 初始化数据库（在 mysql 容器起来后执行，或直接挂载 SQL/ 初始化）
#      mysql -h 127.0.0.1 -P 3306 -u root -p video_platform < SQL/01_user_service.sql ...
#   3) 构建镜像并启动
#      docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# 说明：
#   - 各微服务通过 Nacos(nacos:8848) 做服务发现；application.yml 使用 optional:nacos:，
#     即使 Nacos 未就绪也能先以本地配置启动（仅告警）。
#   - 服务间调用走服务名（nacos 注册），网关对外的统一入口为 8080。
#   - 数据库/Redis/MinIO 主机名已通过环境变量注入（见下方 environment）。

networks:
  vidora-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  nacos-logs:
  minio-data:

services:
  # ---------------- 基础设施 ----------------
  mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: vidora-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: ${TZ}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks: [vidora-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:${REDIS_VERSION}
    container_name: vidora-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks: [vidora-net]

  nacos:
    image: nacos/nacos-server:${NACOS_VERSION}
    container_name: vidora-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      TZ: ${TZ}
    ports:
      - "8848:8848"
    volumes:
      - nacos-logs:/home/nacos/logs
    networks: [vidora-net]

  minio:
    image: minio/minio:${MINIO_VERSION}
    container_name: vidora-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [vidora-net]

  # ---------------- 微服务（一一对应） ----------------
  gateway-service:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/gateway-service:${IMAGE_TAG}
    container_name: vidora-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ}
      JAVA_OPTS: ${JAVA_OPTS}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR: nacos:8848
    depends_on: [nacos]
    networks: [vidora-net]

  auth-service:
    build:
      context: ../auth
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/auth-service:${IMAGE_TAG}
    container_name: vidora-auth
    restart: unless-stopped
    ports:
      - "8101:8101"
    environment:
      TZ: ${TZ}
      JAVA_OPTS: ${JAVA_OPTS}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/video_platform?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on: [mysql, redis, nacos]
    networks: [vidora-net]

  system-service:
    build:
      context: ../vidora-modules/system
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/system-service:${IMAGE_TAG}
    container_name: vidora-system
    restart: unless-stopped
    ports:
      - "8108:8108"
    environment:
      TZ: ${TZ}
      JAVA_OPTS: ${JAVA_OPTS}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/video_platform?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on: [mysql, redis, nacos]
    networks: [vidora-net]

  video-service:
    build:
      context: ../vidora-modules/video
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/video-service:${IMAGE_TAG}
    container_name: vidora-video
    restart: unless-stopped
    ports:
      - "8102:8102"
    environment:
      TZ: ${TZ}
      JAVA_OPTS: ${JAVA_OPTS}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/video_platform?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 存储（minio 或 local）。使用 minio 时指向容器名 minio:9000
      STORAGE_TYPE: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESSKEY: ${MINIO_ROOT_USER}
      STORAGE_SECRETKEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${MINIO_BUCKET}
      # FFmpeg：默认使用容器内 ffmpeg；若镜像不含 ffmpeg，请改用带 ffmpeg 的基础镜像或挂载宿主 ffmpeg
      FFMPEG_FFMPEG-PATH: ffmpeg
      FFMPEG_FFPROBE-PATH: ffprobe
    depends_on: [mysql, redis, nacos, minio]
    networks: [vidora-net]

  content-service:
    build:
      context: ../vidora-modules/content
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/content-service:${IMAGE_TAG}
    container_name: vidora-content
    restart: unless-stopped
    ports:
      - "8103:8103"
    environment:
      TZ: ${TZ}
      JAVA_OPTS: ${JAVA_OPTS}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/video_platform?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on: [mysql, redis, nacos]
    networks: [vidora-net]

  interact-service:
    build:
      context: ../vidora-modules/interact
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/interact-service:${IMAGE_TAG}
    container_name: vidora-interact
    restart: unless-stopped
    ports:
      - "8104:8104"
    environment:
      TZ: ${TZ}
      JAVA_OPTS: ${JAVA_OPTS}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/video_platform?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on: [mysql, redis, nacos]
    networks: [vidora-net]

  message-service:
    build:
      context: ../vidora-modules/message
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/message-service:${IMAGE_TAG}
    container_name: vidora-message
    restart: unless-stopped
    ports:
      - "8105:8105"
    environment:
      TZ: ${TZ}
      JAVA_OPTS: ${JAVA_OPTS}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/video_platform?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on: [mysql, redis, nacos]
    networks: [vidora-net]

  search-service:
    build:
      context: ../vidora-modules/search
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/search-service:${IMAGE_TAG}
    container_name: vidora-search
    restart: unless-stopped
    ports:
      - "8106:8106"
    environment:
      TZ: ${TZ}
      JAVA_OPTS: ${JAVA_OPTS}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/video_platform?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on: [mysql, redis, nacos]
    networks: [vidora-net]

  recommend-service:
    build:
      context: ../vidora-modules/recommend
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/recommend-service:${IMAGE_TAG}
    container_name: vidora-recommend
    restart: unless-stopped
    ports:
      - "8107:8107"
    environment:
      TZ: ${TZ}
      JAVA_OPTS: ${JAVA_OPTS}
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/video_platform?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on: [mysql, redis, nacos]
    networks: [vidora-net]
