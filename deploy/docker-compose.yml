# 视频播放平台 - 一站式编排（基础设施 + 9 个微服务，一一对应）
#
# 使用步骤（依赖离线缓存于 F:\repository）：
#   1) 在本机用 Maven 打包所有可运行服务（产出各模块 target/*.jar）
#      & 'D:\apache-maven-3.9.6\bin\mvn.cmd' -f pom.xml -pl vidora-gateway,vidora-auth,vidora-modules/vidora-system,vidora-modules/vidora-video,vidora-modules/vidora-content,vidora-modules/vidora-interact,vidora-modules/vidora-message,vidora-modules/vidora-search,vidora-modules/vidora-recommend -am package -DskipTests -o
#   2) 复制 deploy/.env.example 为 deploy/.env，并把其中的 change-me 口令全部改掉
#   3) 构建镜像并启动（MySQL 首次启动会自动执行 ../SQL/vidora_cloud.sql 建库建表）
#      docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# 说明：
#   - SQL/ 下只有一个文件 `vidora_cloud.sql`：一个业务库、内部按业务功能分节（用户与权限 / 审计 /
#     视频 / 内容 / 互动 / 消息 / 搜索 / 推荐），只描述目标态（建库 + 全部建表 + 种子），
#     不保留迁移脚本；改结构就改对应节里的 CREATE TABLE。
#     除 gateway 与 auth 外的 7 个服务连的是**同一个库**：库级隔离没有了，边界靠表名前缀守。
#     auth-service **不连库**，用户与客户端经 Dubbo 向 system-service 取。
#     ⚠️ initdb.d 只在 MySQL **数据卷为空**时生效；已有 mysql-data 卷时脚本不会再跑，
#     存量库要重建（DROP DATABASE 后重跑）或手工执行等价 DDL。
#   - 各微服务通过 Nacos(nacos:8848) 做**服务注册与发现**，它同时是 **Dubbo 的注册中心**；
#     配置中心暂未接入，所有配置都在各服务自己的 application.yml 里
#     （重新启用配置中心的步骤见 .code/ARCHITECTURE.md 6.2）。
#     Nacos 未就绪时服务仍能启动，只是注册不上、网关找不到下游、Dubbo 也导出不了。
#   - 服务间调用走服务名（nacos 注册），网关对外的统一入口为 8080。
#   - Dubbo 的 20880 **刻意不对外发布**：它注册到 Nacos 的是容器内网 IP，宿主机上的
#     consumer 拿到也连不通。所以 provider 与 consumer 必须在网络同一侧——
#     要么都在本 compose 网络里，要么都在宿主机上跑（见 .code/ARCHITECTURE.md 6.2.2）。

networks:
  vidora-net:
    driver: bridge

volumes:
  app-logs:
  mysql-data:
  redis-data:
  nacos-logs:
  minio-data:
  rocketmq-store:
  sentinel-logs:

# 所有微服务共用的环境变量（基础设施主机名 + 数据库账号）
x-app-env: &app-env
  TZ: ${TZ}
  JAVA_OPTS: ${JAVA_OPTS}
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
  SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel-dashboard:8858
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  # 日志落盘目录：logback-base.xml 的 LOG_HOME 读这个值（relaxed binding，不用改 yml）
  VIDORA_LOG_PATH: /app/logs

# 等待 MySQL / Redis / Nacos 就绪后再启动业务服务
x-app-depends: &app-depends
  mysql:
    condition: service_healthy
  redis:
    condition: service_started
  nacos:
    condition: service_started

services:
  # ---------------- 基础设施 ----------------
  mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: vidora-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅当 mysql-data 为空时执行 SQL/ 下全部脚本（目前只有 vidora_cloud.sql：一个业务库、按业务分节）。
      # 脚本是普通 DDL（不带 IF NOT EXISTS），已有库上重跑会直接报错 —— 重建请先 down -v 删卷。
      - ../SQL:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks: [vidora-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:${REDIS_VERSION}
    container_name: vidora-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks: [vidora-net]

  nacos:
    image: nacos/nacos-server:${NACOS_VERSION}
    container_name: vidora-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      TZ: ${TZ}
    ports:
      - "8848:8848"
      # 9848 / 9849 是 Nacos 2.x 的 gRPC 端口，客户端（SCA 服务注册、Dubbo 的 nacos registry）
      # 自己按「主端口 + 1000 / + 1001」算出来，服务端不会告知。不发布它们的后果只出现在
      # **服务跑在宿主机、Nacos 跑在容器里**这种组合上：8848 通、readiness 也返回 OK，
      # 但注册时报 `ErrCode:-401, Client not connected, current status:STARTING`，
      # 又因为 spring.cloud.nacos.discovery.fail-fast 默认 true，整个应用启动失败。
      # 宿主机端口号必须和容器内一致（9848:9848），否则客户端算出来的端口对不上。
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos-logs:/home/nacos/logs
    networks: [vidora-net]

  minio:
    image: minio/minio:${MINIO_VERSION}
    container_name: vidora-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [vidora-net]

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:${SENTINEL_VERSION}
    container_name: vidora-sentinel
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "8858:8858"
    networks: [vidora-net]

  rocketmq-namesrv:
    image: apache/rocketmq:${ROCKETMQ_VERSION}
    container_name: vidora-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    networks: [vidora-net]

  rocketmq-broker:
    image: apache/rocketmq:${ROCKETMQ_VERSION}
    container_name: vidora-rocketmq-broker
    restart: unless-stopped
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf
    environment:
      JAVA_OPT_EXT: -Xms512m -Xmx512m -Xmn256m
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    depends_on: [rocketmq-namesrv]
    networks: [vidora-net]

  # ---------------- 微服务（一一对应） ----------------
  gateway-service:
    build:
      context: ../vidora-gateway
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/gateway-service:${IMAGE_TAG}
    container_name: vidora-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      # 必须与 auth-service 一致，否则网关验签失败
      JWT_SECRET: ${JWT_SECRET}
    depends_on: [nacos]
    volumes:
      - app-logs:/app/logs
    networks: [vidora-net]

  auth-service:
    build:
      context: ../vidora-auth
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/auth-service:${IMAGE_TAG}
    container_name: vidora-auth
    restart: unless-stopped
    ports:
      - "8101:8101"
    environment:
      <<: *app-env
      JWT_SECRET: ${JWT_SECRET}
      # 本服务不连库：用户与客户端数据经 Dubbo 向 system-service 取，所以没有 SPRING_DATASOURCE_URL
      DUBBO_REGISTRY_ADDRESS: "nacos://nacos:8848"
    depends_on: *app-depends
    volumes:
      - app-logs:/app/logs
    networks: [vidora-net]

  system-service:
    build:
      context: ../vidora-modules/vidora-system
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/system-service:${IMAGE_TAG}
    container_name: vidora-system
    restart: unless-stopped
    ports:
      - "8108:8108"
    # 20880 是 Dubbo 的 provider 端口，刻意不对外发布：Dubbo 注册进 Nacos 的是容器内网 IP，
    # 宿主机上的消费方拿到它也连不上。所以 provider 与 consumer 必须同侧——
    # 要么都在本 compose 里，要么都在宿主机上用 mvn spring-boot:run 起（此时注册的是 127.0.0.1）。
    environment:
      <<: *app-env
      # 单库 vidora_cloud：RBAC、用户与两张审计表都归本服务写；auth-service 要用户数据走 Dubbo，不直连库
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/vidora_cloud?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      DUBBO_REGISTRY_ADDRESS: "nacos://nacos:8848"
    depends_on: *app-depends
    volumes:
      - app-logs:/app/logs
    networks: [vidora-net]

  video-service:
    build:
      context: ../vidora-modules/vidora-video
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/video-service:${IMAGE_TAG}
    container_name: vidora-video
    restart: unless-stopped
    ports:
      - "8102:8102"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/vidora_cloud?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      # 存储（minio 或 local）。使用 minio 时指向容器名 minio:9000
      STORAGE_TYPE: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${MINIO_BUCKET}
      # 镜像内已通过 apt 安装 ffmpeg / ffprobe
      FFMPEG_FFMPEG_PATH: ffmpeg
      FFMPEG_FFPROBE_PATH: ffprobe
      # 打开 MQ 投递（应用侧默认 false，此时转码只走本地线程池、重启会丢在途任务）
      ROCKETMQ_ENABLED: "true"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
    # service_started 不代表 broker 已可接受连接：Producer 启动失败会让容器退出，
    # 由 restart: unless-stopped 重试到 broker 就绪为止，启动初期看到几次重启属正常现象
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      nacos:
        condition: service_started
      minio:
        condition: service_started
      rocketmq-broker:
        condition: service_started
    volumes:
      - app-logs:/app/logs
    networks: [vidora-net]

  content-service:
    build:
      context: ../vidora-modules/vidora-content
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/content-service:${IMAGE_TAG}
    container_name: vidora-content
    restart: unless-stopped
    ports:
      - "8103:8103"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/vidora_cloud?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
    depends_on: *app-depends
    volumes:
      - app-logs:/app/logs
    networks: [vidora-net]

  interact-service:
    build:
      context: ../vidora-modules/vidora-interact
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/interact-service:${IMAGE_TAG}
    container_name: vidora-interact
    restart: unless-stopped
    ports:
      - "8104:8104"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/vidora_cloud?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
    depends_on: *app-depends
    volumes:
      - app-logs:/app/logs
    networks: [vidora-net]

  message-service:
    build:
      context: ../vidora-modules/vidora-message
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/message-service:${IMAGE_TAG}
    container_name: vidora-message
    restart: unless-stopped
    ports:
      - "8105:8105"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/vidora_cloud?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
    depends_on: *app-depends
    volumes:
      - app-logs:/app/logs
    networks: [vidora-net]

  search-service:
    build:
      context: ../vidora-modules/vidora-search
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/search-service:${IMAGE_TAG}
    container_name: vidora-search
    restart: unless-stopped
    ports:
      - "8106:8106"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/vidora_cloud?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
    depends_on: *app-depends
    volumes:
      - app-logs:/app/logs
    networks: [vidora-net]

  recommend-service:
    build:
      context: ../vidora-modules/vidora-recommend
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}/recommend-service:${IMAGE_TAG}
    container_name: vidora-recommend
    restart: unless-stopped
    ports:
      - "8107:8107"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/vidora_cloud?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
    depends_on: *app-depends
    volumes:
      - app-logs:/app/logs
    networks: [vidora-net]
