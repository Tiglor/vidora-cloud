# 视频播放平台 - 网关反向代理（可选）
# 用法（在 deploy/ 下；compose 项目名为 vidora、网络名为 vidora-net，故实际网络是 vidora_vidora-net）：
#   docker run -d --name vp-nginx --network vidora_vidora-net -p 80:80 \
#     -v ${PWD}/nginx/nginx.conf:/etc/nginx/conf.d/default.conf nginx:alpine
# 将前端静态站点也托管时，把 build 产物放到 /usr/share/nginx/html 并放开 root 配置。

server {
    listen 80;
    server_name _;

    # 前端静态资源（若把 web 构建产物挂到这里）
    # root /usr/share/nginx/html;
    # index index.html;
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }

    # 后端统一入口：/api -> 网关 8080
    # proxy_pass 末尾不能带 /，否则会剥掉 /api 前缀，而网关路由正是匹配 /api/** 后才 StripPrefix=1
    location /api/ {
        proxy_pass http://gateway-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 视频切片等大文件直出（minio 9000），可按需开启
    # location /files/ {
    #     proxy_pass http://minio:9000/;
    # }
}
