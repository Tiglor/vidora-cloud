server:
  port: 8080

spring:
  application:
    name: gateway-service

  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:xiao123456}
      database: 0

  cloud:
    # Nacos：当前只用服务注册与发现，配置中心暂缓（重新启用步骤见 .code/ARCHITECTURE.md 6.2）
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

    # Spring Cloud Gateway (5.0 前缀变更为 spring.cloud.gateway.server.webflux)
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: profile-service
              uri: lb://auth-service
              predicates:
                # 用户自助偏好设置（改主题等）。和 /api/auth/** 同一个服务，但这条路径要登录：
                # 它不在网关白名单里，也不在 ADMIN_PATH_PREFIXES 里，所以 web 和 admin 都能调
                - Path=/api/profile/**
              filters:
                - StripPrefix=1
            - id: user-menu-service
              uri: lb://system-service
              predicates:
                - Path=/api/menus/**
              filters:
                - StripPrefix=1
            - id: user-role-service
              uri: lb://system-service
              predicates:
                - Path=/api/roles/**
              filters:
                - StripPrefix=1
            - id: user-admin-service
              uri: lb://system-service
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1
            - id: system-client-service
              uri: lb://system-service
              predicates:
                - Path=/api/clients/**
              filters:
                - StripPrefix=1
            - id: system-log-service
              uri: lb://system-service
              predicates:
                # 操作日志 / 登录日志查询，只有 read 接口（没有删除与清空）。
                # 「仅限管理端」由 GatewayAuthFilter 的 ADMIN_PATH_PREFIXES 判定，不靠路由
                - Path=/api/oper-logs/**,/api/login-logs/**
              filters:
                - StripPrefix=1
            - id: video-service
              uri: lb://video-service
              predicates:
                - Path=/api/videos/**
              filters:
                - StripPrefix=1
            - id: content-service
              uri: lb://content-service
              predicates:
                # 分类、标签、推荐流配置、热搜榜、内容安全审核都归内容服务
                # /api/hot-searches/** 和 search-service 的 /api/search/** 不重叠：后者只匹配以 /api/search/ 开头的路径
                - Path=/api/categories/**,/api/tags/**,/api/feed-configs/**,/api/hot-searches/**,/api/security-audits/**
              filters:
                - StripPrefix=1
            - id: interact-service
              uri: lb://interact-service
              predicates:
                # 评论、点赞收藏分享、弹幕、播放计数都归互动服务
                - Path=/api/comments/**,/api/actions/**,/api/danmaku/**,/api/play-counts/**
              filters:
                - StripPrefix=1
            - id: message-service
              uri: lb://message-service
              predicates:
                # 消息收件箱、私信会话、推送设备绑定都归消息服务
                - Path=/api/messages/**,/api/conversations/**,/api/push-devices/**
              filters:
                - StripPrefix=1
            - id: search-service
              uri: lb://search-service
              predicates:
                # 搜索历史（/search/history）、词频统计（/search/stats）、建议词（/search/suggests）
                # 三个控制器都挂在 /search 下，所以这一条就够了，不需要再加 /api/suggests/**
                - Path=/api/search/**
              filters:
                - StripPrefix=1
            - id: recommend-service
              uri: lb://recommend-service
              predicates:
                # 推荐候选、算法配置、用户特征都归推荐服务
                - Path=/api/recommends/**,/api/algo-configs/**,/api/user-features/**
              filters:
                - StripPrefix=1

    sentinel:
      transport:
        # Sentinel 控制台地址；容器内由 SENTINEL_DASHBOARD 覆盖为 sentinel-dashboard:8858
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      eager: true

# JWT 签名配置
# 生产环境务必用环境变量 JWT_SECRET 覆盖，密钥长度需 >= 32 字节
jwt:
  secret: ${JWT_SECRET:vidora-cloud-dev-only-secret-key-change-me-32bytes-min}
  expire-seconds: 604800

# 网关自身的行为开关
gateway:
  # 管理端客户端标识，GatewayAuthFilter 用它判定 ADMIN_PATH_PREFIXES 那批前缀放不放行。
  # 必须和 sys_client 表里管理端那行的 client_key 一致（种子数据是 'admin'）；
  # 在「客户端管理」页改了这个值，这里要跟着改，否则所有管理接口一律 403。
  admin-client-key: ${GATEWAY_ADMIN_CLIENT_KEY:admin}

# 日志：落盘目录、分级文件（app / error / audit）、滚动与保留策略统一在
# common-core 的 logback-base.xml 里定义，产物落在 logs/<服务名>/ 下；
# 容器里用环境变量 VIDORA_LOG_PATH 指到日志卷。这里只调级别。
logging:
  level:
    root: info
