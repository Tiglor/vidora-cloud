server:
  port: 8102

spring:
  application:
    name: video-service

  # Datasource
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/video_service?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:xiao123456}
      database: 0

  cloud:
    # Nacos：当前只用服务注册与发现，配置中心暂缓（重新启用步骤见 docs/ARCHITECTURE.md 6.2）
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

    # OpenFeign
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
            loggerLevel: basic

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  mapper-locations: classpath*:/mapper/*.xml

# Storage: minio | local
storage:
  type: minio
  endpoint: ${STORAGE_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  bucket: videos
  local-dir: ./upload
  url-expire-seconds: 3600
  local-public-base: http://localhost:8102/files

# FFmpeg (requires ffmpeg/ffprobe on PATH or absolute path)
ffmpeg:
  ffmpeg-path: ffmpeg
  ffprobe-path: ffprobe
  hls-time: 10
  work-dir: ./transcode

# Transcode (async multi-bitrate HLS)
transcode:
  enabled: true
  hwaccel: none            # none | cuda(NVENC) | qsv(Intel QuickSync)
  segment-type: fmp4       # fmp4(CMAF) | ts(MPEG-TS)
  hls-time: 4
  master-name: master.m3u8
  core-pool-size: 2
  max-pool-size: 4
  max-retry: 2
  renditions:
    - name: 1080p
      width: 1920
      height: 1080
      video-bitrate: 4500
      maxrate: 5500
      bufsize: 11000
      audio-bitrate: 192
    - name: 720p
      width: 1280
      height: 720
      video-bitrate: 2500
      maxrate: 3200
      bufsize: 6400
      audio-bitrate: 128
    - name: 480p
      width: 854
      height: 480
      video-bitrate: 1200
      maxrate: 1500
      bufsize: 3000
      audio-bitrate: 128
    - name: 360p
      width: 640
      height: 360
      video-bitrate: 800
      maxrate: 1000
      bufsize: 2000
      audio-bitrate: 96

# RocketMQ：转码任务的持久化投递
# enabled=false 时不创建 MQ 客户端，转码退回本地 transcodeExecutor 线程池（进程重启会丢在途任务）
rocketmq:
  enabled: ${ROCKETMQ_ENABLED:false}
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer-group: vidora-video-transcode-producer
  consumer-group: vidora-video-transcode-consumer
  transcode-topic: vidora-transcode-task
  send-timeout-millis: 3000
  # 消费失败后由 broker 重投的上限；耗尽则把任务置为失败并 ack，前端才能轮询到终态
  max-reconsume-times: 3
  # 转码是 CPU/IO 重活，消费并发与 transcode.core-pool-size 对齐即可，开太大只是互相抢 CPU
  consume-thread-min: 2
  consume-thread-max: 4

# SpringDoc OpenAPI
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 日志：落盘目录、分级文件（app / error / audit）、滚动与保留策略统一在
# common-core 的 logback-base.xml 里定义，产物落在 logs/<服务名>/ 下；
# 容器里用环境变量 VIDORA_LOG_PATH 指到日志卷。这里只调级别。
logging:
  level:
    root: info

---
# 开发期才打开 SQL 日志：生产把语句连参数一起打进日志，
# 等于把业务数据多复制一份到日志系统里，谁都能翻。
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    org.tiglor.video.mapper: debug
