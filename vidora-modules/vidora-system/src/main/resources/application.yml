server:
  port: 8108

spring:
  application:
    name: system-service

  # Datasource：单库 vidora_cloud（SQL/vidora_cloud.sql 按业务分节）。库不隔离了，边界靠表名前缀守：
  # 本服务只管 sys_* / user_* 和两张审计表，别的节只读不写、要写就走服务间调用。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/vidora_cloud?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}

  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:xiao123456}
      database: 0

  # Nacos：当前只用服务注册与发现，配置中心暂缓（重新启用步骤见 .code/ARCHITECTURE.md 6.2）
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

# Dubbo：本服务是 provider，把 RemoteUserApi / RemoteClientApi 导出给 auth-service。
# 扫描哪个包由启动类上的 @EnableDubbo 指定，这里刻意不写 dubbo.scan.base-packages——
# 两处都配会各注册一个 ServiceAnnotationPostProcessor。
dubbo:
  application:
    name: system-service
    # QoS 是 Dubbo 自带的运维端口（默认 22222），本仓库没有用它，关掉少一个监听口
    qos-enable: false
    # 只做 interface 级注册。默认值 all 还会额外做一次 app-level（instance）注册，而那条路依赖
    # 元数据中心存「接口名 → 应用名」映射——下面 use-as-metadata-center 是刻意关掉的，
    # 于是每导出一个接口就打一条 ERROR「Failed register interface application mapping ...
    # error code: 5-10. This may be caused by configuration server disconnected」，
    # 看着像注册中心断了，实际是配置自相矛盾。消费方订阅的是 interface 级的 providers:... 节点，
    # 不依赖这条映射，所以关掉 instance 注册不影响调用，只是让启动日志回到干净状态。
    # 将来若有第二个 provider 服务，同样要加这一行。
    register-mode: interface
  registry:
    # 和上面的 spring.cloud.nacos.discovery 共用同一个 Nacos 服务器，但用 namespace=dubbo
    # 隔离注册中心 —— 不然 Spring Cloud Gateway 的 Service Discovery 会把 Dubbo 协议端口（20880）
    # 当成 HTTP 实例一起做负载均衡，打到 Dubbo 端口的 HTTP 请求全部 500。
    # Gateway 看到的只应该是 Spring Cloud 注册的 HTTP 端口（8108），Dubbo provider/consumer
    # 的互相发现走独立 namespace，互不干扰。
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:8848?namespace=dubbo}
    # 本项目不用 Nacos 做配置管理（配置全写死在 application.yml 里），也不发布元数据中心。
    # 开关只能写在 registry 上——dubbo.config-center.enabled / dubbo.metadata-report.enabled
    # 是无效属性（Dubbo 3.3.6 的这两个 config 类没有 enabled 字段，绑定时被静默忽略），
    # 不关掉 Dubbo 就会把 registry 提升成 config center + metadata report 去连它们的接口，
    # server status check 失败即抛 IllegalStateException，服务直接起不来。详见 vidora-auth 同名注释。
    use-as-config-center: false
    use-as-metadata-center: false
  protocol:
    name: dubbo
    # 9 个服务里目前只有 system-service 是 provider，所以默认端口不用避让；
    # 将来第二个 provider 上线时必须给它另一个端口，同一台机器上撞端口会启动失败
    port: ${DUBBO_PROTOCOL_PORT:20880}
  provider:
    # 登录链路上的调用，超时给到 5s：比 HTTP 侧的 Feign 宽松，因为这条链路失败等于登录不了
    timeout: 5000

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  mapper-locations: classpath*:/mapper/*.xml

# SpringDoc OpenAPI
springdoc:
  # 接口说明取自 controller/service 上的 Javadoc（therapi 编译期烘进 target/classes，处理器见根 pom），不是 Swagger 注解
  enable-javadoc: true
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 日志：落盘目录、分级文件（app / error / audit）、滚动与保留策略统一在
# common-core 的 logback-base.xml 里定义，产物落在 logs/<服务名>/ 下；
# 容器里用环境变量 VIDORA_LOG_PATH 指到日志卷。这里只调级别。
logging:
  level:
    root: info

---
# 开发期才打开 SQL 日志：生产把语句连参数一起打进日志，
# 等于把业务数据多复制一份到日志系统里，谁都能翻。
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    org.tiglor.system.mapper: debug
    org.tiglor.common.log.mapper: debug
