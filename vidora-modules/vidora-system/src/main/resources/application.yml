server:
  port: 8108

spring:
  application:
    name: system-service

  # Datasource：单库 vidora_cloud（SQL/vidora_cloud.sql 按业务分节）。库不隔离了，边界靠表名前缀守：
  # 本服务只管 sys_* / user_* 和两张审计表，别的节只读不写、要写就走服务间调用。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/vidora_cloud?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}

  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:xiao123456}
      database: 0

  # Nacos：当前只用服务注册与发现，配置中心暂缓（重新启用步骤见 .code/ARCHITECTURE.md 6.2）
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

# Dubbo：本服务是 provider，把 RemoteUserApi / RemoteClientApi 导出给 auth-service。
# 扫描哪个包由启动类上的 @EnableDubbo 指定，这里刻意不写 dubbo.scan.base-packages——
# 两处都配会各注册一个 ServiceAnnotationPostProcessor。
dubbo:
  application:
    name: system-service
    # QoS 是 Dubbo 自带的运维端口（默认 22222），本仓库没有用它，关掉少一个监听口
    qos-enable: false
  registry:
    # 和上面的 spring.cloud.nacos.discovery 是同一个 Nacos，但走 Dubbo 自己的注册路径：
    # Nacos 里会多出 providers:org.tiglor.api.system.RemoteUserApi:: 这类接口级条目，不是重复注册
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:8848}
  protocol:
    name: dubbo
    # 9 个服务里目前只有 system-service 是 provider，所以默认端口不用避让；
    # 将来第二个 provider 上线时必须给它另一个端口，同一台机器上撞端口会启动失败
    port: ${DUBBO_PROTOCOL_PORT:20880}
  provider:
    # 登录链路上的调用，超时给到 5s：比 HTTP 侧的 Feign 宽松，因为这条链路失败等于登录不了
    timeout: 5000

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  mapper-locations: classpath*:/mapper/*.xml

# SpringDoc OpenAPI
springdoc:
  # 接口说明取自 controller/service 上的 Javadoc（therapi 编译期烘进 target/classes，处理器见根 pom），不是 Swagger 注解
  enable-javadoc: true
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 日志：落盘目录、分级文件（app / error / audit）、滚动与保留策略统一在
# common-core 的 logback-base.xml 里定义，产物落在 logs/<服务名>/ 下；
# 容器里用环境变量 VIDORA_LOG_PATH 指到日志卷。这里只调级别。
logging:
  level:
    root: info

---
# 开发期才打开 SQL 日志：生产把语句连参数一起打进日志，
# 等于把业务数据多复制一份到日志系统里，谁都能翻。
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    org.tiglor.system.mapper: debug
    org.tiglor.common.log.mapper: debug
