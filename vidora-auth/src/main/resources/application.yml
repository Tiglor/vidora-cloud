server:
  port: 8101

spring:
  application:
    name: auth-service

  # Datasource
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/user_service?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}

  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:xiao123456}
      database: 0

  # Nacos：当前只用服务注册与发现，配置中心暂缓（重新启用步骤见 docs/ARCHITECTURE.md 6.2）
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  mapper-locations: classpath*:/mapper/*.xml

# JWT 签名配置
# 生产环境务必用环境变量 JWT_SECRET 覆盖，密钥长度需 >= 32 字节
# 必须与 vidora-gateway 保持一致，否则网关验签失败
jwt:
  secret: ${JWT_SECRET:vidora-cloud-dev-only-secret-key-change-me-32bytes-min}
  expire-seconds: 604800

# SpringDoc OpenAPI
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 日志：落盘目录、分级文件（app / error / audit）、滚动与保留策略统一在
# vidora-common-log 的 logback-base.xml 里定义，产物落在 logs/<服务名>/ 下；
# 容器里用环境变量 VIDORA_LOG_PATH 指到日志卷。这里只调级别。
logging:
  level:
    root: info

---
# 开发期才打开 SQL 日志：生产把语句连参数一起打进日志，
# 等于把业务数据多复制一份到日志系统里，谁都能翻。
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    org.tiglor.common.user.mapper: debug
