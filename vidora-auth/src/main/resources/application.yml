server:
  port: 8101

spring:
  application:
    name: auth-service

  # 本服务不连库：用户、角色、菜单、客户端全部经 Dubbo 向 system-service 取，
  # 所以这里没有 datasource，也没有 mybatis-plus 段。要加回来先想清楚为什么不能让 system 代查。

  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:xiao123456}
      database: 0

  # Nacos：当前只用服务注册与发现，配置中心暂缓（重新启用步骤见 .code/ARCHITECTURE.md 6.2）
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

# Dubbo：本服务是 consumer，只引用不导出，所以没有 protocol / scan 段
dubbo:
  application:
    name: auth-service
    # QoS 是 Dubbo 自带的运维端口（默认 22222），本仓库没有用它，关掉少一个监听口
    qos-enable: false
  registry:
    # 与 system-service 保持一致：Dubbo 注册/发现走 dubbo namespace，
    # 避免 Spring Cloud Gateway 误把 Dubbo 协议端口当成 HTTP 实例做负载均衡
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:8848?namespace=dubbo}
    # 别把这两行改回 dubbo.config-center.enabled / dubbo.metadata-report.enabled：
    # Dubbo 3.3.6 的 ConfigCenterConfig / MetadataReportConfig 根本没有 enabled 字段，
    # 写上去会被配置绑定静默忽略，看起来禁用了其实没有。真正的开关在 RegistryConfig 上。
    # 不关的后果：DefaultApplicationDeployer 发现没有显式 config center，就把 registry
    # 提升成 config center + metadata report 去连 Nacos 的这两套接口，server status check
    # 失败即抛 IllegalStateException，服务直接起不来（本项目不用配置中心，配置全在 yml 里）。
    use-as-config-center: false
    use-as-metadata-center: false
  consumer:
    # 启动时 provider 不在线也不要报错。否则 system-service 没起来时 auth 根本启动不了，
    # 排障时就看不到「auth 活着、但登录报 no provider」这个更有信息量的状态
    check: false
    timeout: 5000

# JWT 签名配置
# 生产环境务必用环境变量 JWT_SECRET 覆盖，密钥长度需 >= 32 字节
# 必须与 vidora-gateway 保持一致，否则网关验签失败
jwt:
  secret: ${JWT_SECRET:vidora-cloud-dev-only-secret-key-change-me-32bytes-min}
  expire-seconds: 604800

# SpringDoc OpenAPI
springdoc:
  # 接口说明取自 controller/service 上的 Javadoc（therapi 编译期烘进 target/classes，处理器见根 pom），不是 Swagger 注解
  enable-javadoc: true
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 日志：落盘目录、分级文件（app / error / audit）、滚动与保留策略统一在
# common-core 的 logback-base.xml 里定义，产物落在 logs/<服务名>/ 下；
# 容器里用环境变量 VIDORA_LOG_PATH 指到日志卷。这里只调级别。
logging:
  level:
    root: info

